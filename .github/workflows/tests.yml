# The test suite on what the servers run: Ubuntu 22.04 and its python3 (3.10). No root, no network: the tests
# stub sudo, systemctl, docker and the rest (tests/test_scripts.py); the real-Ubuntu container tests stay opt-in.
name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: python3 -m unittest discover -s tests
        run: |
          python3 --version
          python3 -m unittest discover -s tests
  publish-local:
    needs: unittest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    concurrency:
      group: local-update-channel
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
      - name: Publish only the tested master commit
        env:
          TESTED: ${{ github.sha }}
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          if [ "$head" != "$TESTED" ]; then
            echo "master moved to $head; its own successful CI will publish it"
            exit 0
          fi
          git push origin "HEAD:refs/heads/deploy/local"
