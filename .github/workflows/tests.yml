# All jobs run on the local worker. Tests retain Ubuntu 22.04 / Python 3.10 in a Docker runtime.
# Their host commands are stand-ins; real-host integration tests remain opt-in.
name: tests

on:
  push:
    branches: ['**']

  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: [self-hosted, linux, setup.build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the Ubuntu 22.04 and Python 3.10 test runtime
        run: >-
          docker build --build-arg CI_UID="$(id -u)" --build-arg CI_GID="$(id -g)"
          -t setup-server-ci:ubuntu22.04 -f tests/fixtures/ci.Dockerfile tests/fixtures
      - name: python3 -m unittest discover -s tests
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace
          setup-server-ci:ubuntu22.04
          bash -euc 'python3 --version; exec python3 -m unittest discover -s tests'
  publish-local:
    needs: unittest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    concurrency:
      group: local-update-channel
      cancel-in-progress: false
    runs-on: [self-hosted, linux, setup.build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
      - name: Publish only the tested master commit
        env:
          TESTED: ${{ github.sha }}
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          if [ "$head" != "$TESTED" ]; then
            echo "master moved to $head; its own successful CI will publish it"
            exit 0
          fi
          git push origin "HEAD:refs/heads/deploy/local"
  local-update:
    name: Update and verify the local environment
    needs: publish-local
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, setup.build]
    timeout-minutes: 55
    permissions:
      contents: read
    concurrency:
      group: local-environment-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apply the CI-approved versions on this worker
        env:
          EXPECTED_COMPONENT: server
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 bin/apply-local-update
