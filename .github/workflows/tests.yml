# The test suite on what the servers run: Ubuntu 22.04 and its python3 (3.10). No root, no network: the tests
# stub sudo, systemctl, docker and the rest (tests/test_scripts.py); the real-Ubuntu container tests stay opt-in.
name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: python3 -m unittest discover -s tests
        run: |
          python3 --version
          python3 -m unittest discover -s tests
  publish-local:
    needs: unittest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    concurrency:
      group: local-update-channel
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
      - name: Publish only the tested master commit
        env:
          TESTED: ${{ github.sha }}
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          if [ "$head" != "$TESTED" ]; then
            echo "master moved to $head; its own successful CI will publish it"
            exit 0
          fi
          git push origin "HEAD:refs/heads/deploy/local"
  local-update:
    name: Update and verify the local environment
    needs: publish-local
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, setup.build]
    timeout-minutes: 55
    permissions:
      contents: read
    concurrency:
      group: local-environment-update
      cancel-in-progress: false
    steps:
      - name: Apply the CI-approved versions on this worker
        env:
          EXPECTED_COMPONENT: server
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo -n systemctl start setup-server-auto-update.service
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          state = json.loads((Path(os.environ['SETUP_SERVER_ROOT']) / 'auto-update/status.json').read_text())
          if state.get('result') not in ('updated', 'up_to_date'):
              raise SystemExit('Local update did not succeed; inspect the service journal')
          heads = {}
          for side, directory in state['paths'].items():
              def git(*arguments):
                  return subprocess.check_output(['git', '-C', directory, *arguments], text=True).strip()
              head = git('rev-parse', 'HEAD')
              if head != state['targets'][side] or head != git('rev-parse', 'refs/remotes/origin/deploy/local'):
                  raise SystemExit(side + ': local checkout is not the current CI-approved commit')
              if git('status', '--porcelain', '--untracked-files=normal'):
                  raise SystemExit(side + ': local edits appeared; deployment verification stopped')
              heads[side] = head
          component = os.environ['EXPECTED_COMPONENT']
          subprocess.run(['git', '-C', state['paths'][component], 'merge-base', '--is-ancestor',
                          os.environ['EXPECTED_COMMIT'], heads[component]], check=True)
          print('Local checkouts, health checks and installed server refresh succeeded:', heads)
          PY
